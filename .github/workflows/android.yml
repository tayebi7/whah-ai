name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, on-device-engine]
    paths: ["mobile/**", "src/**", "public/**", "next.config.mjs", "package.json", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the app as static files (no server: the app answers its own /api calls)
        run: |
          npm install --no-audit --no-fund
          rm -rf src/app/api
          WAHA_STATIC=1 NEXT_PUBLIC_WAHA_LOCAL=1 npx next build
          mkdir -p mobile/www
          cp -r out/. mobile/www/
          ls mobile/www | head
      - name: Install Capacitor and generate the Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: Permissions, cleartext and icon
        working-directory: mobile/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application android:usesCleartextTraffic="true"#' "$M"
          sudo apt-get install -y librsvg2-bin >/dev/null 2>&1 || true
          if command -v rsvg-convert >/dev/null; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir=app/src/main/res/mipmap-${d%%:*}; s=${d##*:}
              for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
                rsvg-convert -w $s -h $s ../../public/logo-mark.svg -o $dir/$f.png || true
              done
            done
          fi
          cat "$M"
      - name: Sync and build debug APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk waha-ai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waha-ai-apk
          path: waha-ai.apk
      - name: Publish to a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" waha-ai.apk --title "Waha AI APK #${GITHUB_RUN_NUMBER}" --notes "Debug-signed Android APK. Fully on-device: no server. Open Settings, add your AI providers (NVIDIA, OpenRouter, DeepSeek, ...) and use the app." --latest
