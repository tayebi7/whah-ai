name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System tools used by the integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pandoc libreoffice-writer poppler-utils tesseract-ocr tesseract-ocr-ara fonts-noto-core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true
