name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System tools used by the integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pandoc libreoffice-writer poppler-utils tesseract-ocr tesseract-ocr-ara fonts-noto-core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          set +e
          npx tsc --noEmit --pretty false > tsc.log 2>&1
          code=$?
          sed -E 's/^([^(]+)\(([0-9]+),([0-9]+)\): (.*)$/::error file=\1,line=\2,col=\3::\4/' tsc.log | head -60
          exit $code
      - name: Test
        run: |
          set +e
          npx tsx --test --test-reporter=spec tests/*.test.ts > test.log 2>&1
          code=$?
          grep -nE "✖|Error|expected|actual|not ok|ENOENT|missing" test.log | head -40 | sed -E 's/^/::error::/' | tr '\r' ' '
          exit $code
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true
