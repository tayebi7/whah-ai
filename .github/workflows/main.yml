name: Build WHAH AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WHAH AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform (safe)
        run: |
          if [ -d "android" ]; then
            echo "android/ already exists"
          else
            flutter create . \
              --project-name whah_ai \
              --org com.whah.ai \
              --platforms=android
          fi

      - name: Add INTERNET permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s||&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|android:name="${applicationName}"|android:name="${applicationName}"\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Verify main.dart is WHAH AI
        run: |
          if grep -q "Flutter Demo Home Page\|MyHomePage" lib/main.dart; then
            echo "ERROR: main.dart overwritten!"
            exit 1
          fi
          echo "main.dart OK"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whah-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
