name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --project-name whah_ai --org com.whah .

      - name: Allow internet + cleartext HTTP
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $MANIFEST || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $MANIFEST
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $MANIFEST
          sed -i 's#android:label="[^"]*"#android:label="whah ai"#' $MANIFEST

      - name: Generate icon
        run: |
          pip install pillow
          python tools/make_icon.py

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Package APK
        run: |
          find build -name "*.apk" -type f || true
          APK=$(find build -name "*.apk" -type f | head -1)
          echo "APK=$APK"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/whah-ai.apk
          ls -lh out/whah-ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: whah-ai-apk
          path: out/whah-ai.apk
          if-no-files-found: error
