name: Build WHAH AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WHAH AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Backup source files (protect from overwrite)
        run: |
          mkdir -p /tmp/whah-backup
          cp -a lib /tmp/whah-backup/
          cp pubspec.yaml /tmp/whah-backup/
          cp -a assets /tmp/whah-backup/ 2>/dev/null || true
          echo "Source files backed up"

      - name: Create Android platform
        run: |
          rm -rf android
          flutter create . \
            --project-name whah_ai \
            --org com.whah.ai \
            --platforms=android \
            --overwrite
          echo "android/ created"
          ls android/

      - name: Restore source files
        run: |
          # Restore our real code (in case --overwrite touched anything)
          rm -rf lib
          cp -a /tmp/whah-backup/lib .
          cp /tmp/whah-backup/pubspec.yaml .
          cp -a /tmp/whah-backup/assets . 2>/dev/null || true
          echo "Source files restored"
          head -15 lib/main.dart

      - name: Add INTERNET permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest not found"
            find android -type f | head -20
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s||&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|android:name="${applicationName}"|android:name="${applicationName}"\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi
          echo "Manifest patched"
          cat "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Verify main.dart is WHAH AI
        run: |
          if grep -q "Flutter Demo Home Page\|MyHomePage\|class MyApp" lib/main.dart; then
            echo "ERROR: main.dart is Flutter demo!"
            exit 1
          fi
          if ! grep -q "WahaAI\|ChatPage" lib/main.dart; then
            echo "ERROR: main.dart does not look like WHAH AI"
            cat lib/main.dart
            exit 1
          fi
          echo "✅ main.dart is correct (WHAH AI)"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whah-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
