name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create --platforms=android --project-name whah_ai --org com.whah .

      - name: Android config (minSdk + internet + permissions)
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"

          grep -q 'READ_MEDIA_IMAGES' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application#' "$MANIFEST"

          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          sed -i 's#android:label="[^"]*"#android:label="whah ai"#' "$MANIFEST"

          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle || true
            sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts || true
            sed -i 's/minSdkVersion .*/minSdk = 24/' android/app/build.gradle.kts || true
          fi

      - name: Generate icon
        run: |
          pip install pillow
          python tools/make_icon.py
          ls -la assets/

      - name: Pub get
        run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Locate APK
        run: |
          echo "Searching for APK files..."
          find build -name "*.apk" -type f 2>/dev/null || true
          APK=$(find build -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found under build/"
            find build -type f 2>/dev/null | head -80 || true
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          mkdir -p out
          cp "$APK" out/whah-ai.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whah-ai-apk
          path: out/whah-ai.apk
          if-no-files-found: error
