name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name whah_ai \
            --org com.whah .

      - name: Generate app icons
        run: |
          python3 -m pip install --upgrade pillow
          python3 tools/make_icon.py

      - name: Configure Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          GRADLE="android/app/build.gradle.kts"

          grep -q "android.permission.INTERNET" "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"

          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"

          sed -i 's#android:label="[^"]*"#android:label="Waha AI"#' "$MANIFEST"

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE"

          echo "Android compileSdk:"
          grep "compileSdk" "$GRADLE"

      - name: Flutter dependencies
        run: flutter pub get

      - name: Check generated assets
        run: |
          test -f assets/icon.png
          test -f assets/icon_fg.png
          echo "Icons OK"

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        run: |
          APK=$(find build -name "*.apk" -type f | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          mkdir -p out
          cp "$APK" out/whah-ai.apk

          echo "APK generated successfully:"
          ls -lh out/whah-ai.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whah-ai-apk
          path: out/whah-ai.apk
          if-no-files-found: error
