name: Build WHAH AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WHAH AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure Flutter platform folders
        run: |
          if [ ! -d "android" ]; then
            echo "android/ missing — generating..."
            flutter create . --project-name whah_ai --org com.whah.ai --platforms=android --overwrite
          else
            echo "android/ already exists — OK"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Patch old plugins missing Android namespace
        run: |
          patched=0
          for f in $(find "$HOME/.pub-cache/hosted" -path '*/android/build.gradle' 2>/dev/null || true); do
            if ! grep -q "namespace" "$f" 2>/dev/null; then
              dir=$(dirname "$f")
              pkg=$(grep -oP 'package="\K[^"]+' "$dir/src/main/AndroidManifest.xml" 2>/dev/null | head -1 || true)
              if [ -n "$pkg" ]; then
                sed -i "0,/android {/s//android {\n    namespace \"$pkg\"/" "$f" 2>/dev/null || true
                echo "patched $f -> $pkg"
                patched=$((patched+1))
              fi
            fi
          done
          echo "Patched $patched plugin(s)"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whah-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
