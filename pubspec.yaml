  Widget _buildMessage(
    ChatMessage message,
  ) {
    final isUser =
        message.role == 'user';

    return Align(
      alignment: isUser
          ? Alignment.centerRight
          : Alignment.centerLeft,
      child: Container(
        constraints:
            const BoxConstraints(
          maxWidth: 900,
        ),
        margin:
            const EdgeInsets.symmetric(
          horizontal: 12,
          vertical: 6,
        ),
        padding:
            const EdgeInsets.all(14),
        decoration: BoxDecoration(
          color: isUser
              ? const Color(0xFFDDF2FF)
              : Colors.white,
          borderRadius:
              BorderRadius.circular(18),
          border: Border.all(
            color:
                const Color(0xFFDCEAF2),
          ),
        ),
        child: Column(
          crossAxisAlignment:
              CrossAxisAlignment.start,
          children: [
            Row(
              mainAxisSize:
                  MainAxisSize.min,
              children: [
                Icon(
                  isUser
                      ? Icons.person_outline
                      : Icons.auto_awesome,
                  size: 18,
                ),
                const SizedBox(width: 7),
                Text(
                  isUser
                      ? 'أنت'
                      : 'WHAH AI',
                  style:
                      const TextStyle(
                    fontWeight:
                        FontWeight.bold,
                  ),
                ),
              ],
            ),
            const SizedBox(height: 8),
            if (message.content.isNotEmpty)
              MarkdownBody(
                data: message.content,
                selectable: true,
                onTapLink: (
                  text,
                  href,
                  title,
                ) async {
                  if (href == null) {
                    return;
                  }

                  final uri =
                      Uri.tryParse(href);

                  if (uri != null) {
                    await launchUrl(
                      uri,
                      mode: LaunchMode
                          .externalApplication,
                    );
                  }
                },
              ),
            if (message.files.isNotEmpty) ...[
              const SizedBox(height: 8),
              ...message.files.map(
                (file) {
                  return Container(
                    margin:
                        const EdgeInsets.only(
                      top: 5,
                    ),
                    padding:
                        const EdgeInsets.all(8),
                    decoration:
                        BoxDecoration(
                      color:
                          const Color(0xFFF1F7FA),
                      borderRadius:
                          BorderRadius.circular(
                        10,
                      ),
                    ),
                    child: Row(
                      children: [
                        const Icon(
                          Icons
                              .insert_drive_file,
                          size: 18,
                        ),
                        const SizedBox(
                          width: 8,
                        ),
                        Expanded(
                          child: Text(
                            file.name,
                            overflow:
                                TextOverflow
                                    .ellipsis,
                          ),
                        ),
                      ],
                    ),
                  );
                },
              ),
            ],
            if (!isUser &&
                message.content.isNotEmpty)
              Align(
                alignment:
                    Alignment.centerRight,
                child: IconButton(
                  tooltip: 'نسخ',
