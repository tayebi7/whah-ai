name: whah_ai
description: Waha AI - مساعد ذكاء اصطناعي متعدد الاستخدامات
publish_to: "none"

version: 1.0.3+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # الاتصال بالسيرفرات ومزودات الذكاء الاصطناعي
  http: ^1.2.2

  # History والإعدادات والحفظ المحلي
  shared_preferences: ^2.3.2

  # عرض Markdown والكود
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  # رفع الملفات: PDF / DOCX / TXT / صور / فيديو / ZIP / APK وغيرها
  file_picker: ^13.1.0

  # معرفات المحادثات
  uuid: ^4.5.1

  # حفظ الملفات محلياً
  path_provider: ^2.1.5

  # فتح التطبيقات والروابط الخارجية
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1

  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#60A5FA"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
