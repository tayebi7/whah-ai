      body: Column(
        children: [
          Expanded(
            child:
                _currentChat
                        .messages
                        .isEmpty
                    ? _buildWelcome()
                    : ListView.builder(
                        controller:
                            _scrollController,
                        padding:
                            const EdgeInsets
                                .symmetric(
                          vertical: 12,
                        ),
                        itemCount:
                            _currentChat
                                .messages
                                .length,
                        itemBuilder:
                            (
                          context,
                          index,
                        ) {
                          return _buildMessage(
                            _currentChat
                                .messages[index],
                          );
                        },
                      ),
          ),
          _buildComposer(),
        ],
      ),
    );
  }
}

class SettingsPage
    extends StatefulWidget {
  final WahaSettings settings;

  const SettingsPage({
    super.key,
    required this.settings,
  });

  @override
  State<SettingsPage> createState() =>
      _SettingsPageState();
}

class _SettingsPageState
    extends State<SettingsPage> {
  late TextEditingController
      _endpointController;

  late TextEditingController
      _apiKeyController;

  late TextEditingController
      _modelController;

  late String _provider;

  @override
  void initState() {
    super.initState();

    _provider =
        widget.settings.provider;

    _endpointController =
        TextEditingController(
      text: widget.settings.endpoint,
    );

    _apiKeyController =
        TextEditingController(
      text: widget.settings.apiKey,
    );

    _modelController =
        TextEditingController(
      text: widget.settings.model,
    );
  }

  @override
  void dispose() {
    _endpointController.dispose();
    _apiKeyController.dispose();
    _modelController.dispose();
    super.dispose();
  }

  void _applyProvider(
    String provider,
  ) {
    setState(() {
      _provider = provider;

      if (provider == 'OpenRouter') {
        _endpointController.text =
            'https://openrouter.ai/api/v1/chat/completions';

        if (_modelController.text
            .trim()
            .isEmpty) {
          _modelController.text =
              'openai/gpt-4o-mini';
        }
      } else if (provider == 'OpenAI') {
        _endpointController.text =
            'https://api.openai.com/v1/chat/completions';

        if (_modelController.text
            .trim()
            .isEmpty) {
          _modelController.text =
              'gpt-4o-mini';
        }
      } else if (provider == 'NVIDIA NIM') {
        _endpointController.text =
            'https://integrate.api.nvidia.com/v1/chat/completions';

        if (_modelController.text
            .trim()
            .isEmpty) {
          _modelController.text =
              'meta/llama-3.1-8b-instruct';
        }
      }
    });
  }

  void _save() {
    Navigator.pop(
      context,
      WahaSettings(
        provider: _provider,
        endpoint:
            _endpointController.text.trim(),
        apiKey:
            _apiKeyController.text.trim(),
        model:
            _modelController.text.trim(),
      ),
    );
  }

  @override
  Widget build(
    BuildContext context,
  ) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'إعدادات الذكاء الاصطناعي',
        ),
        actions: [
          IconButton(
            tooltip: 'حفظ',
            onPressed: _save,
            icon: const Icon(
              Icons.check,
            ),
          ),
        ],
      ),
      body: ListView(
        padding:
            const EdgeInsets.all(18),
        children: [
          const Text(
            'مزود الذكاء الاصطناعي',
            style: TextStyle(
              fontSize: 17,
              fontWeight:
                  FontWeight.bold,
            ),
          ),
          const SizedBox(
            height: 8,
          ),
          DropdownButtonFormField<
              String>(
            initialValue: _provider,
            decoration:
                const InputDecoration(
              border:
                  OutlineInputBorder(),
              prefixIcon: Icon(
                Icons.cloud_outlined,
              ),
            ),
            items: const [
              DropdownMenuItem(
                value: 'OpenRouter',
                child: Text(
                  'OpenRouter',
                ),
              ),
              DropdownMenuItem(
                value: 'OpenAI',
                child: Text(
                  'OpenAI',
                ),
              ),
              DropdownMenuItem(
                value: 'NVIDIA NIM',
                child: Text(
                  'NVIDIA NIM',
                ),
              ),
              DropdownMenuItem(
                value: 'Gateway',
                child: Text(
                  'Gateway',
                ),
              ),
              DropdownMenuItem(
                value: 'Custom',
                child: Text(
                  'Custom API',
                ),
              ),
            ],
            onChanged: (value) {
              if (value != null) {
                _applyProvider(
                  value,
                );
              }
            },
          ),
          const SizedBox(
            height: 20,
          ),
          TextField(
            controller:
                _endpointController,
            decoration:
                const InputDecoration(
              labelText:
                  'API Endpoint',
              hintText:
                  'https://example.com/v1/chat/completions',
              border:
                  OutlineInputBorder(),
              prefixIcon:
                  Icon(Icons.link),
            ),
          ),
          const SizedBox(
            height: 16,
          ),
          TextField(
            controller:
                _apiKeyController,
            obscureText: true,
            decoration:
                const InputDecoration(
              labelText: 'API Key',
              border:
                  OutlineInputBorder(),
              prefixIcon:
                  Icon(Icons.key_outlined),
            ),
          ),
          const SizedBox(
            height: 16,
          ),
          TextField(
            controller:
                _modelController,
            decoration:
                const InputDecoration(
              labelText: 'Model',
              hintText:
                  'openai/gpt-4o-mini',
              border:
                  OutlineInputBorder(),
              prefixIcon:
                  Icon(
                Icons.smart_toy_outlined,
              ),
            ),
          ),
          const SizedBox(
            height: 24,
          ),
          Container(
            padding:
                const EdgeInsets.all(14),
            decoration:
                BoxDecoration(
              color:
                  const Color(0xFFEAF7FF),
              borderRadius:
                  BorderRadius.circular(
                14,
              ),
            ),
            child: const Row(
              crossAxisAlignment:
                  CrossAxisAlignment
                      .start,
              children: [
                Icon(
                  Icons.info_outline,
                  color:
                      Colors.lightBlue,
                ),
                SizedBox(
                  width: 10,
                ),
                Expanded(
                  child: Text(
                    'يمكنك استخدام OpenRouter أو OpenAI أو NVIDIA NIM أو أي Gateway متوافق مع OpenAI API.',
                  ),
                ),
              ],
            ),
          ),
          const SizedBox(
            height: 24,
          ),
          FilledButton.icon(
            onPressed: _save,
            icon: const Icon(
              Icons.save,
            ),
            label: const Text(
              'حفظ الإعدادات',
            ),
          ),
        ],
      ),
    );
  }
}
