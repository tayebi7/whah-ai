class AttachedFile {
  final String name;
  final String path;
  final int size;

  const AttachedFile({
    required this.name,
    required this.path,
    required this.size,
  });

  Map<String, dynamic> toJson() {
    return {
      'name': name,
      'path': path,
      'size': size,
    };
  }

  factory AttachedFile.fromJson(Map<String, dynamic> json) {
    return AttachedFile(
      name: json['name']?.toString() ?? '',
      path: json['path']?.toString() ?? '',
      size: json['size'] is int
          ? json['size'] as int
          : int.tryParse(json['size']?.toString() ?? '') ?? 0,
    );
  }
}

class ChatMessage {
  final String id;
  final String role;
  String content;
  final DateTime createdAt;
  final List<AttachedFile> files;

  ChatMessage({
    String? id,
    required this.role,
    required this.content,
    DateTime? createdAt,
    List<AttachedFile>? files,
  })  : id = id ?? const Uuid().v4(),
        createdAt = createdAt ?? DateTime.now(),
        files = files ?? [];

  Map<String, dynamic> toJson() {
    return {
      'id': id,
      'role': role,
      'content': content,
      'createdAt': createdAt.toIso8601String(),
      'files': files.map((file) => file.toJson()).toList(),
    };
  }

  factory ChatMessage.fromJson(Map<String, dynamic> json) {
    final rawFiles = json['files'];

    return ChatMessage(
      id: json['id']?.toString(),
      role: json['role']?.toString() ?? 'user',
      content: json['content']?.toString() ?? '',
      createdAt: DateTime.tryParse(
            json['createdAt']?.toString() ?? '',
          ) ??
          DateTime.now(),
      files: rawFiles is List
          ? rawFiles
              .whereType<Map>()
              .map(
                (file) => AttachedFile.fromJson(
                  Map<String, dynamic>.from(file),
                ),
              )
              .toList()
          : <AttachedFile>[],
    );
  }
}

class ChatHistory {
  final String id;
  String title;
  final DateTime createdAt;
  DateTime updatedAt;
  List<ChatMessage> messages;

  ChatHistory({
    String? id,
    required this.title,
    DateTime? createdAt,
    DateTime? updatedAt,
    List<ChatMessage>? messages,
  })  : id = id ?? const Uuid().v4(),
        createdAt = createdAt ?? DateTime.now(),
        updatedAt = updatedAt ?? DateTime.now(),
        messages = messages ?? [];

  Map<String, dynamic> toJson() {
    return {
      'id': id,
      'title': title,
      'createdAt': createdAt.toIso8601String(),
      'updatedAt': updatedAt.toIso8601String(),
      'messages': messages.map((message) => message.toJson()).toList(),
    };
  }

  factory ChatHistory.fromJson(Map<String, dynamic> json) {
    final rawMessages = json['messages'];

    return ChatHistory(
      id: json['id']?.toString(),
      title: json['title']?.toString() ?? 'محادثة جديدة',
      createdAt: DateTime.tryParse(
            json['createdAt']?.toString() ?? '',
          ) ??
          DateTime.now(),
      updatedAt: DateTime.tryParse(
            json['updatedAt']?.toString() ?? '',
          ) ??
          DateTime.now(),
      messages: rawMessages is List
          ? rawMessages
              .whereType<Map>()
              .map(
                (message) => ChatMessage.fromJson(
                  Map<String, dynamic>.from(message),
                ),
              )
              .toList()
          : <ChatMessage>[],
    );
  }
}

class WahaSettings {
  String provider;
  String endpoint;
  String apiKey;
  String model;

  WahaSettings({
    this.provider = 'OpenRouter',
    this.endpoint =
        'https://openrouter.ai/api/v1/chat/completions',
    this.apiKey = '',
    this.model = 'openai/gpt-4o-mini',
  });

  Map<String, dynamic> toJson() {
    return {
      'provider': provider,
      'endpoint': endpoint,
      'apiKey': apiKey,
      'model': model,
    };
  }

  factory WahaSettings.fromJson(Map<String, dynamic> json) {
    return WahaSettings(
      provider: json['provider']?.toString() ?? 'OpenRouter',
      endpoint: json['endpoint']?.toString() ??
          'https://openrouter.ai/api/v1/chat/completions',
      apiKey: json['apiKey']?.toString() ?? '',
      model: json['model']?.toString() ??
          'openai/gpt-4o-mini',
    );
  }
}

class LocalStorage {
  static const String settingsKey = 'waha_settings';
  static const String historyKey = 'waha_history';

  static Future<WahaSettings> loadSettings() async {
    final prefs = await SharedPreferences.getInstance();
    final raw = prefs.getString(settingsKey);

    if (raw == null || raw.isEmpty) {
      return WahaSettings();
    }

    try {
      final decoded = jsonDecode(raw);

      if (decoded is Map) {
        return WahaSettings.fromJson(
          Map<String, dynamic>.from(decoded),
        );
      }
    } catch (_) {}

    return WahaSettings();
  }

  static Future<void> saveSettings(
    WahaSettings settings,
  ) async {
    final prefs = await SharedPreferences.getInstance();

    await prefs.setString(
      settingsKey,
      jsonEncode(settings.toJson()),
    );
  }

  static Future<List<ChatHistory>> loadHistory() async {
    final prefs = await SharedPreferences.getInstance();
    final raw = prefs.getString(historyKey);

    if (raw == null || raw.isEmpty) {
      return [];
    }

    try {
      final decoded = jsonDecode(raw);

      if (decoded is! List) {
        return [];
      }

      return decoded
          .whereType<Map>()
          .map(
            (item) => ChatHistory.fromJson(
              Map<String, dynamic>.from(item),
            ),
          )
          .toList();
    } catch (_) {
      return [];
    }
  }

  static Future<void> saveHistory(
    List<ChatHistory> history,
  ) async {
    final prefs = await SharedPreferences.getInstance();

    await prefs.setString(
      historyKey,
      jsonEncode(
        history.map((chat) => chat.toJson()).toList(),
      ),
    );
  }
}

class ChatPage extends StatefulWidget {
  const ChatPage({super.key});

  @override
  State<ChatPage> createState() => _ChatPageState();
}

class _ChatPageState extends State<ChatPage> {
  WahaSettings _settings = WahaSettings();

  List<ChatHistory> _history = [];

  late ChatHistory _currentChat;

  final TextEditingController _controller =
      TextEditingController();

  final ScrollController _scrollController =
      ScrollController();

  final List<AttachedFile> _attachedFiles = [];

  bool _isLoading = false;

  @override
  void initState() {
    super.initState();

    _currentChat = ChatHistory(
      title: 'محادثة جديدة',
    );

    _loadData();
  }

  @override
  void dispose() {
    _controller.dispose();
    _scrollController.dispose();
    super.dispose();
  }

  Future<void> _loadData() async {
    final settings = await LocalStorage.loadSettings();
    final history = await LocalStorage.loadHistory();

    if (!mounted) return;

    setState(() {
      _settings = settings;
      _history = history;

      if (history.isNotEmpty) {
        _currentChat = history.first;
      }
    });
  }

  String _makeTitle(String text) {
    final clean = text.trim();

    if (clean.isEmpty) {
      return 'محادثة جديدة';
    }

    if (clean.length <= 35) {
      return clean;
    }

    return '${clean.substring(0, 35)}...';
  }

  Future<void> _saveCurrentChat() async {
    _currentChat.updatedAt = DateTime.now();

    final index = _history.indexWhere(
      (chat) => chat.id == _currentChat.id,
    );

    if (index >= 0) {
      _history[index] = _currentChat;
    } else {
      _history.insert(0, _currentChat);
    }

    await LocalStorage.saveHistory(_history);
  }

  void _scrollToBottom() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!_scrollController.hasClients) return;

      _scrollController.animateTo(
        _scrollController.position.maxScrollExtent,
        duration: const Duration(milliseconds: 180),
        curve: Curves.easeOut,
      );
    });
  }

  Future<void> _pickFiles() async {
    try {
      final files = await FilePicker.pickFiles();

      if (files.isEmpty) return;

      final pickedFiles = <AttachedFile>[];

      for (final file in files) {
        final size =
            file.lengthSync() ?? await file.length() ?? 0;

        pickedFiles.add(
          AttachedFile(
            name: file.name,
            path: file.path ?? '',
            size: size,
          ),
        );
      }

      if (!mounted) return;

      setState(() {
        _attachedFiles.addAll(pickedFiles);
      });
    } catch (e) {
      if (!mounted) return;

      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            'تعذر اختيار الملفات: $e',
          ),
        ),
      );
    }
  }

  Future<void> _copyText(String text) async {
    await Clipboard.setData(
      ClipboardData(text: text),
    );

    if (!mounted) return;

    ScaffoldMessenger.of(context).showSnackBar(
      const SnackBar(
        content: Text('تم النسخ'),
        duration: Duration(seconds: 1),
      ),
    );
  }

  Future<void> _openSettings() async {
    final result = await Navigator.push<WahaSettings>(
      context,
      MaterialPageRoute(
        builder: (_) => SettingsPage(
          settings: _settings,
        ),
      ),
    );

    if (result == null || !mounted) return;

    setState(() {
      _settings = result;
    });

    await LocalStorage.saveSettings(_settings);
  }

  void _newChat() {
    setState(() {
      _currentChat = ChatHistory(
        title: 'محادثة جديدة',
      );

      _attachedFiles.clear();
      _controller.clear();
    });
  }

  void _selectChat(ChatHistory chat) {
    setState(() {
      _currentChat = chat;
      _attachedFiles.clear();
      _controller.clear();
    });

    Navigator.pop(context);
  }

  Future<void> _sendMessage() async {
    final text = _controller.text.trim();

    if (text.isEmpty && _attachedFiles.isEmpty) {
      return;
    }

    if (_isLoading) {
      return;
    }

    final userText = text.isEmpty
        ? 'حلل الملفات المرفقة.'
        : text;

    final attached =
        List<AttachedFile>.from(_attachedFiles);

    final displayText = attached.isEmpty
        ? userText
        : '$userText\n\nالملفات المرفقة:\n'
          '${attached.map((file) => '• ${file.name}').join('\n')}';

    final userMessage = ChatMessage(
      role: 'user',
      content: displayText,
      files: attached,
    );

    setState(() {
      if (_currentChat.messages.isEmpty) {
        _currentChat.title =
            _makeTitle(userText);
      }

      _currentChat.messages.add(userMessage);

      _attachedFiles.clear();
      _controller.clear();

      _isLoading = true;
    });

    _scrollToBottom();

    final assistantMessage = ChatMessage(
      role: 'assistant',
      content: '',
    );

    setState(() {
      _currentChat.messages.add(
        assistantMessage,
      );
    });

    try {
      final service = AIService(
        endpoint: _settings.endpoint,
        apiKey: _settings.apiKey,
        model: _settings.model,
        provider: _settings.provider,
      );

      final messages = _currentChat.messages
          .where(
            (message) =>
                message.role == 'user' ||
                message.role == 'assistant',
          )
          .where(
            (message) =>
                message.content.trim().isNotEmpty,
          )
          .map(
            (message) => <String, String>{
              'role': message.role,
              'content': message.content,
            },
          )
          .toList();

      await service.streamMessage(
        messages: messages,
        onChunk: (chunk) {
          if (!mounted) return;

          setState(() {
            assistantMessage.content += chunk;
          });

          _scrollToBottom();
        },
      );

      if (assistantMessage.content.trim().isEmpty) {
        final result = await service.sendMessage(
          messages: messages,
        );

        if (mounted) {
          setState(() {
            assistantMessage.content = result;
          });
        }
      }
    } catch (e) {
      if (mounted) {
        setState(() {
          assistantMessage.content =
              'حدث خطأ أثناء الاتصال:\n\n$e';
        });
      }
    } finally {
      if (mounted) {
        setState(() {
          _isLoading = false;
        });
      }

      await _saveCurrentChat();
      _scrollToBottom();
    }
  }

